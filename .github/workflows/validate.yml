name: Validate Kodi Add-on

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall plugin.video.andyoutube
      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugin.video.andyoutube/addon.xml')
          ET.parse('plugin.video.andyoutube/resources/settings.xml')
          print('XML OK')
          PY
      - name: Read add-on version
        id: addon
        run: |
          VERSION=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse('plugin.video.andyoutube/addon.xml').getroot().attrib['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Vendor yt-dlp and EJS
        run: |
          VENDOR="plugin.video.andyoutube/resources/lib/vendor"
          rm -rf "$VENDOR"
          mkdir -p "$VENDOR"
          # yt-dlp itself and yt-dlp-ejs are pure Python/data packages. Avoid
          # pulling Linux-specific wheels into an add-on that must run on Kodi
          # for Windows/Android as well.
          python -m pip install --disable-pip-version-check --no-compile --no-deps --target "$VENDOR" yt-dlp yt-dlp-ejs
          PYTHONPATH="$VENDOR" python - <<'PY'
          import yt_dlp
          import yt_dlp_ejs
          print('vendored yt-dlp OK:', getattr(getattr(yt_dlp, 'version', None), '__version__', 'unknown'))
          print('vendored yt-dlp-ejs OK')
          PY
      - name: Bundle Deno for Windows Kodi
        run: |
          BIN="plugin.video.andyoutube/resources/bin/win64"
          mkdir -p "$BIN"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" \
            -o /tmp/deno-win64.zip
          python - <<'PY'
          import os, zipfile
          out = 'plugin.video.andyoutube/resources/bin/win64'
          with zipfile.ZipFile('/tmp/deno-win64.zip') as zf:
              member = next(name for name in zf.namelist() if name.endswith('deno.exe'))
              data = zf.read(member)
          path = os.path.join(out, 'deno.exe')
          with open(path, 'wb') as fh:
              fh.write(data)
          print('bundled deno.exe bytes:', os.path.getsize(path))
          PY
      - name: Build install ZIP
        run: |
          mkdir -p dist
          zip -r "dist/plugin.video.andyoutube-${{ steps.addon.outputs.version }}.zip" plugin.video.andyoutube -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin.video.andyoutube-${{ steps.addon.outputs.version }}
          path: dist/plugin.video.andyoutube-${{ steps.addon.outputs.version }}.zip
